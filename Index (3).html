<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper: #ECE8DE;
  --paper-raised: #F5F2EA;
  --ink: #1E2A44;
  --ink-soft: #4B5468;
  --line: #C8C2AF;
  --brass: #A87F3B;
  --brass-dark: #8A6A2F;
  --green: #3F6552;
  --green-bg: #E1E9E2;
  --rust: #A6432D;
  --rust-bg: #F1DFD8;
  --font-display: 'Zilla Slab', Georgia, serif;
  --font-tape: 'Special Elite', 'Courier New', monospace;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

.app-shell{
  max-width: 880px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

/* ---------- Header ---------- */
.eyebrow{
  font-family: var(--font-tape);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0 0 4px;
}
h1.title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34px;
  margin: 0 0 22px;
  letter-spacing: -0.01em;
}

/* ---------- Tape total bar ---------- */
.tape{
  position: relative;
  background: var(--ink);
  color: var(--paper-raised);
  border-radius: 4px;
  padding: 18px 22px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  margin-bottom: 26px;
}
.tape::after{
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -8px;
  height: 10px;
  background:
    linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/10px 10px,
    linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/10px 10px;
  background-repeat: repeat-x;
}
.tape-cell{ min-width: 120px; }
.tape-label{
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.65;
  margin: 0 0 4px;
}
.tape-value{
  font-family: var(--font-tape);
  font-size: 22px;
  margin: 0;
}
.tape-value.rust{ color: #E3A08E; }
.tape-value.green{ color: #9FCBAF; }
.tape-value.brass{ color: #E3C081; }
.tape-budget-row{
  width:100%;
  margin-top: 2px;
}
.tape-budget-row input{
  background: transparent;
  border: none;
  border-bottom: 1px dashed rgba(255,255,255,0.35);
  color: var(--paper-raised);
  font-family: var(--font-tape);
  font-size: 13px;
  width: 90px;
  padding: 2px 0;
}
.tape-budget-row input:focus{ outline: none; border-bottom-color: #E3C081; }
.tape-budget-row label{
  font-size: 11px;
  opacity: 0.65;
  margin-right: 6px;
}

/* ---------- Intake form ---------- */
.intake{
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px 22px 18px;
  margin-bottom: 30px;
}
.intake h2{
  font-family: var(--font-display);
  font-size: 17px;
  margin: 0 0 14px;
  font-weight: 600;
}
.form-grid{
  display: grid;
  grid-template-columns: 2fr 1.3fr 0.7fr 0.9fr;
  gap: 12px 12px;
}
.form-grid .full{ grid-column: 1 / -1; }
.field label{
  display:block;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.field input, .field textarea{
  width: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
}
.field input:focus, .field textarea:focus{
  outline: 2px solid var(--brass);
  outline-offset: 0;
  border-color: var(--brass);
}
.intake-actions{
  display:flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
}
.hint{ font-size: 12px; color: var(--ink-soft); margin-right: auto; }
.auto-tag{
  text-transform: none;
  letter-spacing: 0;
  font-size: 10.5px;
  color: var(--brass-dark);
  font-weight: 400;
  margin-left: 4px;
}
.detect-status{
  margin: 6px 0 0;
  font-size: 12.5px;
  color: var(--ink-soft);
  min-height: 16px;
}
.detect-status.loading{ color: var(--brass-dark); }
.detect-status.ok{ color: var(--green); }
.detect-status.error{ color: var(--rust); }
button{
  font-family: var(--font-body);
  cursor: pointer;
}
.btn-primary{
  background: var(--ink);
  color: var(--paper-raised);
  border: none;
  padding: 10px 20px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 600;
}
.btn-primary:hover{ background: #2A3A5C; }
.btn-secondary{
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 13px;
}
.btn-secondary:hover{ border-color: var(--brass); color: var(--brass-dark); }
.btn-text{
  background: none;
  border: none;
  color: var(--ink-soft);
  font-size: 12px;
  text-decoration: underline;
  padding: 4px;
}
.btn-text:hover{ color: var(--rust); }

/* ---------- Supplier sections ---------- */
.section-label{
  font-family: var(--font-tape);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0 0 12px;
}
.supplier-card{
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 20px;
  overflow: hidden;
}
.supplier-head{
  display:flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,0.4);
}
.supplier-name{
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  margin: 0;
}
.supplier-lifetime{
  font-family: var(--font-tape);
  font-size: 12px;
  color: var(--ink-soft);
}

.po-block{ padding: 16px 18px; border-bottom: 1px solid var(--line); }
.po-block:last-child{ border-bottom: none; }
.po-header{
  display:flex;
  align-items:center;
  justify-content: space-between;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.po-number{
  font-family: var(--font-tape);
  font-size: 13px;
  color: var(--ink-soft);
}
.stamp{
  display:inline-block;
  font-family: var(--font-tape);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 3px;
  transform: rotate(-2deg);
  border: 1.5px solid currentColor;
}
.stamp.pending{ color: var(--rust); background: var(--rust-bg); }
.stamp.ordered{ color: var(--green); background: var(--green-bg); }

table.items{
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
table.items th{
  text-align: left;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 4px 6px 6px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}
table.items td{
  padding: 7px 6px;
  border-bottom: 1px solid rgba(200,194,175,0.5);
  vertical-align: middle;
}
table.items tr:last-child td{ border-bottom: none; }
.item-name a{ color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--brass); }
.item-name a:hover{ color: var(--brass-dark); }
.item-name-nolink{ color: var(--ink); }
.qty-input, .price-input{
  width: 54px;
  padding: 4px 6px;
  border: 1px solid var(--line);
  border-radius: 3px;
  font-family: var(--font-tape);
  font-size: 12.5px;
  background: #fff;
}
.price-input{ width: 66px; }
.line-total{ font-family: var(--font-tape); font-size: 13px; }
.row-delete{
  background:none; border:none; color: var(--ink-soft); font-size: 15px; padding: 2px 6px; line-height:1;
}
.row-delete:hover{ color: var(--rust); }

.po-footer{
  display:flex;
  justify-content: space-between;
  align-items:center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  flex-wrap: wrap;
  gap: 10px;
}
.po-subtotal{
  font-family: var(--font-tape);
  font-size: 15px;
}
.po-actions{ display:flex; gap:8px; flex-wrap: wrap; }
.copy-flash{ font-size: 12px; color: var(--green); margin-left: 6px; }

.history-toggle{
  font-size: 12px;
  color: var(--ink-soft);
  background: none;
  border: none;
  text-decoration: underline;
  padding: 2px;
  margin-top: 4px;
}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;
  padding: 50px 20px;
  color: var(--ink-soft);
  border: 1px dashed var(--line);
  border-radius: 6px;
}
.empty p:first-child{
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--ink);
  margin-bottom: 6px;
}

@media (max-width: 640px){
  .form-grid{ grid-template-columns: 1fr 1fr; }
  .tape{ gap: 16px; }
  table.items{ font-size: 12.5px; }
  table.items th:nth-child(2), table.items td:nth-child(2){ display:none; } /* hide link col on mobile */
}
</style>
</head>
<body>
<div class="app-shell">

  <p class="eyebrow">Classroom Procurement</p>
  <h1 class="title">Supply Ledger</h1>

  <div class="tape" id="tape">
    <div class="tape-cell">
      <p class="tape-label">Spent (ordered)</p>
      <p class="tape-value green" id="tapeSpent">$0.00</p>
    </div>
    <div class="tape-cell">
      <p class="tape-label">Pending (not yet ordered)</p>
      <p class="tape-value rust" id="tapePending">$0.00</p>
    </div>
    <div class="tape-cell" id="tapeBudgetLeftWrap" style="display:none;">
      <p class="tape-label">Budget left</p>
      <p class="tape-value brass" id="tapeBudgetLeft">—</p>
    </div>
    <div class="tape-budget-row">
      <label for="budgetInput">Set budget $</label>
      <input type="number" id="budgetInput" min="0" step="0.01" placeholder="optional">
    </div>
  </div>

  <div class="intake">
    <h2>Add a product</h2>
    <form id="addForm">
      <div class="form-grid">
        <div class="field full">
          <label for="fUrl">Product link</label>
          <input type="url" id="fUrl" required placeholder="https://... (paste a link and we'll fill in the rest)">
          <p class="detect-status" id="detectStatus"></p>
        </div>
        <div class="field full">
          <label for="fName">Product name <span class="auto-tag">auto-detected — editable</span></label>
          <input type="text" id="fName" placeholder="Detected from link">
        </div>
        <div class="field">
          <label for="fSupplier">Supplier <span class="auto-tag">auto</span></label>
          <input type="text" id="fSupplier" list="supplierList" placeholder="Detected">
          <datalist id="supplierList"></datalist>
        </div>
        <div class="field">
          <label for="fPrice">Unit price $ <span class="auto-tag">auto</span></label>
          <input type="number" id="fPrice" min="0" step="0.01" placeholder="Detected">
        </div>
        <div class="field">
          <label for="fQty">Qty</label>
          <input type="number" id="fQty" min="1" step="1" value="1">
        </div>
      </div>
      <div class="intake-actions">
        <button type="button" class="btn-secondary" id="lookupBtn">Look up again</button>
        <button type="submit" class="btn-primary">Add to ledger</button>
      </div>
    </form>
  </div>

  <div id="suppliersWrap"></div>

</div>

<script>
(function(){
  const STORAGE_KEY_ITEMS = 'ledger-items';
  const STORAGE_KEY_POS = 'ledger-pos';
  const STORAGE_KEY_BUDGET = 'ledger-budget';

  let items = [];
  let purchaseOrders = [];
  let budget = null;
  let expandedHistory = {}; // supplier -> bool

  const fmt = (n) => '$' + (Math.round(n * 100) / 100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ---------- storage ----------
  async function loadAll(){
    try{
      const r = await window.storage.get(STORAGE_KEY_ITEMS);
      items = r ? JSON.parse(r.value) : [];
    }catch(e){ items = []; }
    try{
      const r = await window.storage.get(STORAGE_KEY_POS);
      purchaseOrders = r ? JSON.parse(r.value) : [];
    }catch(e){ purchaseOrders = []; }
    try{
      const r = await window.storage.get(STORAGE_KEY_BUDGET);
      budget = r ? JSON.parse(r.value) : null;
    }catch(e){ budget = null; }
    document.getElementById('budgetInput').value = budget !== null ? budget : '';
    render();
  }

  async function saveItems(){
    try{ await window.storage.set(STORAGE_KEY_ITEMS, JSON.stringify(items)); }
    catch(e){ console.error('save items failed', e); }
  }
  async function savePOs(){
    try{ await window.storage.set(STORAGE_KEY_POS, JSON.stringify(purchaseOrders)); }
    catch(e){ console.error('save pos failed', e); }
  }
  async function saveBudget(){
    try{ await window.storage.set(STORAGE_KEY_BUDGET, JSON.stringify(budget)); }
    catch(e){ console.error('save budget failed', e); }
  }

  // ---------- supplier guessing (fallback only, used if AI lookup fails) ----------
  function guessSupplierFromUrl(url){
    try{
      const u = new URL(url);
      let host = u.hostname.replace(/^www\./,'');
      const parts = host.split('.');
      let name = parts.length >= 2 ? parts[parts.length-2] : parts[0];
      return name.charAt(0).toUpperCase() + name.slice(1);
    }catch(e){ return ''; }
  }

  function isValidUrl(str){
    try{ new URL(str); return true; }catch(e){ return false; }
  }

  function setDetectStatus(msg, kind){
    const el = document.getElementById('detectStatus');
    el.textContent = msg;
    el.className = 'detect-status' + (kind ? ' ' + kind : '');
  }

  let lastDetectedUrl = '';

  async function detectFromUrl(url){
    if(!isValidUrl(url)) return;
    lastDetectedUrl = url;
    setDetectStatus('Looking up product name, price, and supplier…', 'loading');
    document.getElementById('lookupBtn').disabled = true;

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          messages: [{
            role: "user",
            content: "Look up the product at this exact URL: " + url +
              "\n\nUse web search to find, as of right now: 1) the product's name/title, 2) its current listed price (just the number, no currency symbol or text), 3) the store or retailer name (e.g. \"Amazon\", \"Staples\", \"Officeworks\")." +
              "\n\nRespond with ONLY one raw JSON object and nothing else, in exactly this shape: {\"name\": string or null, \"price\": number or null, \"supplier\": string or null}. If you can't confidently determine a field, use null for it rather than guessing."
          }]
        })
      });

      if(lastDetectedUrl !== url) return; // a newer lookup superseded this one

      const data = await response.json();
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const fullText = textBlocks.join('\n');
      const candidates = fullText.match(/\{[\s\S]*?\}/g) || [];
      let parsed = null;
      for(let i = candidates.length - 1; i >= 0; i--){
        try{ parsed = JSON.parse(candidates[i]); break; }catch(e){}
      }

      if(parsed && (parsed.name || parsed.price || parsed.supplier)){
        if(parsed.name) document.getElementById('fName').value = parsed.name;
        if(parsed.supplier) document.getElementById('fSupplier').value = parsed.supplier;
        else document.getElementById('fSupplier').value = guessSupplierFromUrl(url);
        if(parsed.price !== null && parsed.price !== undefined && !isNaN(parsed.price)){
          document.getElementById('fPrice').value = Number(parsed.price).toFixed(2);
        }
        const missing = [];
        if(!parsed.name) missing.push('name');
        if(parsed.price === null || parsed.price === undefined) missing.push('price');
        if(!parsed.supplier) missing.push('supplier');
        setDetectStatus(missing.length ? `Detected most details — double-check ${missing.join(' & ')}` : 'Detected — double-check before adding', missing.length ? 'error' : 'ok');
      } else {
        document.getElementById('fSupplier').value = guessSupplierFromUrl(url);
        setDetectStatus("Couldn't detect the details automatically — please fill them in", 'error');
      }
    }catch(e){
      document.getElementById('fSupplier').value = guessSupplierFromUrl(url);
      setDetectStatus("Lookup failed — please fill in name, price, and supplier manually", 'error');
    }finally{
      document.getElementById('lookupBtn').disabled = false;
    }
  }

  document.getElementById('fUrl').addEventListener('blur', function(){
    if(this.value && this.value !== lastDetectedUrl) detectFromUrl(this.value.trim());
  });
  document.getElementById('lookupBtn').addEventListener('click', function(){
    const url = document.getElementById('fUrl').value.trim();
    if(url) detectFromUrl(url);
    else setDetectStatus('Paste a product link first', 'error');
  });

  // ---------- PO logic ----------
  function getOrCreateOpenPO(supplier){
    let po = purchaseOrders.find(p => p.supplier === supplier && p.status === 'open');
    if(po) return po;
    const existingCount = purchaseOrders.filter(p => p.supplier === supplier).length;
    po = {
      id: uid(),
      supplier,
      number: existingCount + 1,
      status: 'open',
      createdAt: Date.now(),
      orderedAt: null
    };
    purchaseOrders.push(po);
    return po;
  }

  function poCode(supplier){
    return supplier.replace(/[^a-zA-Z]/g,'').slice(0,3).toUpperCase() || 'GEN';
  }

  function lineTotal(item){ return (Number(item.qty)||0) * (Number(item.price)||0); }

  function poTotal(po){
    return items.filter(i => i.poId === po.id).reduce((s,i) => s + lineTotal(i), 0);
  }

  // ---------- add item ----------
  document.getElementById('addForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('fName').value.trim();
    const url = document.getElementById('fUrl').value.trim();
    let supplier = document.getElementById('fSupplier').value.trim();
    const qty = Math.max(1, parseInt(document.getElementById('fQty').value) || 1);
    const price = Math.max(0, parseFloat(document.getElementById('fPrice').value) || 0);

    if(!name){
      setDetectStatus('Add a product name (or paste a link and wait for lookup) before adding', 'error');
      return;
    }
    if(!supplier) supplier = url ? (guessSupplierFromUrl(url) || 'Unspecified') : 'Unspecified';

    const po = getOrCreateOpenPO(supplier);
    items.push({ id: uid(), poId: po.id, name, url, supplier, qty, price, addedAt: Date.now() });

    await saveItems();
    await savePOs();

    this.reset();
    document.getElementById('fQty').value = 1;
    setDetectStatus('', '');
    lastDetectedUrl = '';
    render();
  });

  // ---------- budget ----------
  let budgetTimer;
  document.getElementById('budgetInput').addEventListener('input', function(){
    clearTimeout(budgetTimer);
    const val = this.value;
    budgetTimer = setTimeout(async () => {
      budget = val === '' ? null : Math.max(0, parseFloat(val) || 0);
      await saveBudget();
      renderTape();
    }, 400);
  });

  // ---------- mutations from item rows ----------
  window.__updateItemField = async function(id, field, value){
    const item = items.find(i => i.id === id);
    if(!item) return;
    if(field === 'qty') item.qty = Math.max(1, parseInt(value) || 1);
    if(field === 'price') item.price = Math.max(0, parseFloat(value) || 0);
    await saveItems();
    render();
  };

  window.__deleteItem = async function(id){
    items = items.filter(i => i.id !== id);
    await saveItems();
    render();
  };

  window.__markOrdered = async function(poId){
    const po = purchaseOrders.find(p => p.id === poId);
    if(!po) return;
    po.status = 'ordered';
    po.orderedAt = Date.now();
    await savePOs();
    render();
  };

  window.__toggleHistory = function(supplier){
    expandedHistory[supplier] = !expandedHistory[supplier];
    render();
  };

  window.__copyOrder = async function(poId){
    const po = purchaseOrders.find(p => p.id === poId);
    if(!po) return;
    const poItems = items.filter(i => i.poId === po.id);
    const lines = [
      `Purchase Order — ${po.supplier}`,
      `PO #: ${poCode(po.supplier)}-${String(po.number).padStart(3,'0')}`,
      `Date: ${new Date(po.orderedAt || Date.now()).toLocaleDateString()}`,
      '',
      'Items:'
    ];
    poItems.forEach((it, idx) => {
      lines.push(`${idx+1}. ${it.name} — Qty ${it.qty} x ${fmt(it.price)} = ${fmt(lineTotal(it))}${it.url ? ' (' + it.url + ')' : ''}`);
    });
    lines.push('', `Total: ${fmt(poTotal(po))}`);
    const text = lines.join('\n');
    try{
      await navigator.clipboard.writeText(text);
      flashCopy(poId);
    }catch(e){
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); flashCopy(poId); }catch(err){}
      document.body.removeChild(ta);
    }
  };

  function flashCopy(poId){
    const el = document.getElementById('flash-' + poId);
    if(el){
      el.textContent = 'Copied!';
      setTimeout(() => { el.textContent = ''; }, 1800);
    }
  }

  // ---------- render ----------
  function renderTape(){
    const spent = purchaseOrders.filter(p => p.status === 'ordered')
      .reduce((s,p) => s + poTotal(p), 0);
    const pending = purchaseOrders.filter(p => p.status === 'open')
      .reduce((s,p) => s + poTotal(p), 0);
    document.getElementById('tapeSpent').textContent = fmt(spent);
    document.getElementById('tapePending').textContent = fmt(pending);
    const wrap = document.getElementById('tapeBudgetLeftWrap');
    if(budget !== null && !isNaN(budget)){
      wrap.style.display = '';
      const left = budget - spent;
      document.getElementById('tapeBudgetLeft').textContent = (left < 0 ? '-' : '') + fmt(Math.abs(left));
    } else {
      wrap.style.display = 'none';
    }
  }

  function renderSupplierList(){
    const suppliers = [...new Set(items.map(i => i.supplier))].sort();
    const dl = document.getElementById('supplierList');
    dl.innerHTML = suppliers.map(s => `<option value="${escapeHtml(s)}">`).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function itemRow(item){
    const link = item.url
      ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.name)}</a>`
      : `<span class="item-name-nolink">${escapeHtml(item.name)}</span>`;
    return `
      <tr>
        <td class="item-name">${link}</td>
        <td>${item.url ? '<span style="font-size:11px;color:var(--ink-soft);">link ↗</span>' : ''}</td>
        <td><input class="qty-input" type="number" min="1" value="${item.qty}" onchange="__updateItemField('${item.id}','qty',this.value)"></td>
        <td><input class="price-input" type="number" min="0" step="0.01" value="${item.price}" onchange="__updateItemField('${item.id}','price',this.value)"></td>
        <td class="line-total">${fmt(lineTotal(item))}</td>
        <td><button class="row-delete" title="Remove" onclick="__deleteItem('${item.id}')">✕</button></td>
      </tr>`;
  }

  function poBlock(po, isOpen){
    const poItems = items.filter(i => i.poId === po.id);
    if(poItems.length === 0 && !isOpen) return ''; // skip empty closed POs
    const code = `${poCode(po.supplier)}-${String(po.number).padStart(3,'0')}`;
    return `
      <div class="po-block">
        <div class="po-header">
          <span class="po-number">PO ${code}${po.orderedAt ? ' · ordered ' + new Date(po.orderedAt).toLocaleDateString() : ''}</span>
          <span class="stamp ${po.status === 'ordered' ? 'ordered' : 'pending'}">${po.status === 'ordered' ? 'Ordered' : 'Pending'}</span>
        </div>
        ${poItems.length ? `
        <table class="items">
          <thead><tr><th>Item</th><th></th><th>Qty</th><th>Unit $</th><th>Line $</th><th></th></tr></thead>
          <tbody>${poItems.map(itemRow).join('')}</tbody>
        </table>` : `<p style="font-size:13px;color:var(--ink-soft);margin:6px 0;">No items yet.</p>`}
        <div class="po-footer">
          <span class="po-subtotal">Subtotal: ${fmt(poTotal(po))}</span>
          <div class="po-actions">
            ${poItems.length ? `<button class="btn-secondary" onclick="__copyOrder('${po.id}')">Copy order text</button>` : ''}
            ${po.status === 'open' && poItems.length ? `<button class="btn-secondary" onclick="__markOrdered('${po.id}')">Mark as ordered</button>` : ''}
            <span class="copy-flash" id="flash-${po.id}"></span>
          </div>
        </div>
      </div>`;
  }

  function render(){
    renderTape();
    renderSupplierList();

    const wrap = document.getElementById('suppliersWrap');
    if(items.length === 0){
      wrap.innerHTML = `
        <div class="empty">
          <p>The ledger is empty</p>
          <p>Paste in a product link above and it'll start sorting itself into purchase orders by supplier.</p>
        </div>`;
      return;
    }

    const suppliers = [...new Set(purchaseOrders.map(p => p.supplier))];
    // sort by most recent activity
    suppliers.sort((a,b) => {
      const lastA = Math.max(0, ...items.filter(i=>i.supplier===a).map(i=>i.addedAt));
      const lastB = Math.max(0, ...items.filter(i=>i.supplier===b).map(i=>i.addedAt));
      return lastB - lastA;
    });

    wrap.innerHTML = suppliers.map(supplier => {
      const pos = purchaseOrders.filter(p => p.supplier === supplier)
        .sort((a,b) => b.number - a.number);
      const openPO = pos.find(p => p.status === 'open');
      const orderedPOs = pos.filter(p => p.status === 'ordered' && items.some(i => i.poId === p.id));
      const lifetime = pos.reduce((s,p) => s + poTotal(p), 0);
      const isExpanded = !!expandedHistory[supplier];

      return `
        <div class="supplier-card">
          <div class="supplier-head">
            <p class="supplier-name">${escapeHtml(supplier)}</p>
            <span class="supplier-lifetime">${fmt(lifetime)} lifetime</span>
          </div>
          ${openPO ? poBlock(openPO, true) : ''}
          ${orderedPOs.length ? `
            <div style="padding: 4px 18px 14px;">
              <button class="history-toggle" onclick="__toggleHistory('${escapeHtml(supplier)}')">
                ${isExpanded ? 'Hide' : 'Show'} ${orderedPOs.length} past order${orderedPOs.length>1?'s':''}
              </button>
            </div>
            ${isExpanded ? orderedPOs.map(p => poBlock(p, false)).join('') : ''}
          ` : ''}
        </div>`;
    }).join('');
  }

  loadAll();
})();
</script>
</body>
</html>
